name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Remove Termux AAPT2 override
        run: |
          if [ -f android/gradle.properties ]; then
            sed -i '/android.aapt2FromMavenOverride/d' android/gradle.properties
          fi

      - name: Set Android SDK versions
        run: |
          sed -i 's/compileSdkVersion = 34/compileSdkVersion = 36/' android/variables.gradle
          sed -i 's/targetSdkVersion = 34/targetSdkVersion = 36/' android/variables.gradle

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bonfire-pizzeria-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
